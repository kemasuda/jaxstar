name: Publish Python distributions

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Inspect distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify tag-derived version
        id: version
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c 'import importlib.metadata as m, os; from packaging.version import Version; actual = m.version("jaxstar"); expected = os.environ["GITHUB_REF_NAME"].removeprefix("v"); assert actual == expected, f"{actual} != {expected}"; output = os.environ["GITHUB_OUTPUT"]; print(f"version={actual}", file=open(output, "a")); print(f"is-prerelease={str(Version(actual).is_prerelease).lower()}", file=open(output, "a")); print(actual)'

      - name: Verify stable release target
        if: steps.version.outputs.is-prerelease == 'false'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish distributions to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jaxstar
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    name: Verify installation from TestPyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the tagged version from TestPyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if python -m pip install --no-cache-dir --no-deps \
              --index-url https://test.pypi.org/simple/ \
              "jaxstar==${version}"; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi
            sleep 15
          done
          python -c 'import importlib.metadata as m, os; actual = m.version("jaxstar"); expected = os.environ["GITHUB_REF_NAME"].removeprefix("v"); assert actual == expected, f"{actual} != {expected}"; print(actual)'

  publish-pypi:
    name: Publish distributions to PyPI
    needs: [build, verify-testpypi]
    if: needs.build.outputs.is-prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jaxstar
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    name: Verify installation from PyPI
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the tagged version from PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if python -m pip install --no-cache-dir --no-deps \
              --index-url https://pypi.org/simple/ \
              "jaxstar==${version}"; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi
            sleep 15
          done
          python -c 'import importlib.metadata as m, os; actual = m.version("jaxstar"); expected = os.environ["GITHUB_REF_NAME"].removeprefix("v"); assert actual == expected, f"{actual} != {expected}"; print(actual)'
