name: Publish to TestPyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Inspect distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify tag-derived version
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c 'import importlib.metadata as m, os; actual = m.version("jaxstar"); expected = os.environ["GITHUB_REF_NAME"].removeprefix("v"); assert actual == expected, f"{actual} != {expected}"; print(actual)'

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish distributions to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jaxstar
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify installation from TestPyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the tagged version from TestPyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if python -m pip install --no-cache-dir --no-deps \
              --index-url https://test.pypi.org/simple/ \
              "jaxstar==${version}"; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi
            sleep 15
          done
          python -c 'import importlib.metadata as m, os; actual = m.version("jaxstar"); expected = os.environ["GITHUB_REF_NAME"].removeprefix("v"); assert actual == expected, f"{actual} != {expected}"; print(actual)'
