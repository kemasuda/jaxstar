name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build

      - name: Verify wheel installation
        run: |
          python -m pip uninstall -y jaxstar
          python -m pip install --no-deps dist/*.whl
          python -c "import jaxstar; print(jaxstar.__version__)"

      - name: Verify source distribution installation
        run: |
          python -m pip uninstall -y jaxstar
          python -m pip install --no-deps dist/*.tar.gz
          python -c "import jaxstar; print(jaxstar.__version__)"
